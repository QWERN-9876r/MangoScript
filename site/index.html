<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Mango Todos</title>
    <link rel="stylesheet" href="/style.css" />
    <script type="module" src="/dist/app.js"></script>
  </head>
  <body>
    <main>
      <header>
        <h1><span aria-hidden="true">🥭</span> Mango Todos</h1>
        <p>Тестовый сайт: и страница, и сервер написаны на MangoScript.</p>
      </header>

      <form id="new-todo">
        <input id="title" placeholder="Что сделать?" autocomplete="off" autofocus />
        <button>Добавить</button>
      </form>
      <p id="message" role="alert" hidden></p>

      <nav aria-label="Фильтр">
        <button data-filter="all">Все</button>
        <button data-filter="active">Активные</button>
        <button data-filter="done">Готовые</button>
      </nav>

      <ul id="list"></ul>

      <footer>
        <span id="summary"></span>
        <button id="clear-done">Убрать готовые</button>
      </footer>
    </main>
  </body>
</html>
